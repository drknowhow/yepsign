name: release

# Push a tag like v0.9.0 to build the extension zip and attach it to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pymupdf numpy fonttools
      - run: npm ci
      - run: npm run vendor
      - run: npm test
      - name: Check the tag matches the manifest version
        run: |
          test "v$(node -p "require('./extension/manifest.json').version")" = "$GITHUB_REF_NAME"
      - run: npm run package
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/yepsign-*.zip \
            --title "YepSign $GITHUB_REF_NAME" \
            --notes "To install, download the zip and unzip it. Open chrome://extensions, turn on Developer mode, choose Load unpacked and pick the unzipped folder."
